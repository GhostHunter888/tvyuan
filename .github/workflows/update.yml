name: 每日同步 TVBox

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Backup workflow
        run: cp .github/workflows/update.yml /tmp/update.yml

      - name: Download upstream
        run: |
          git clone https://github.com/25175/tvyuan.git /tmp/upstream
          rm -rf ./*
          cp -a /tmp/upstream/. .

      - name: Restore workflow
        run: |
          mkdir -p .github/workflows
          cp /tmp/update.yml .github/workflows/update.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto update from 25175/tvyuan" || echo "No changes"
          git push origin HEAD:master
