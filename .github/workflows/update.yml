name: 每日同步 TVBox

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: 检出当前仓库
    uses: actions/checkout@v5
    with:
      fetch-depth: 0

  - name: 备份工作流
    run: |
      mkdir -p /tmp/workflow-backup
      cp .github/workflows/update.yml /tmp/workflow-backup/update.yml

  - name: 同步上游
    run: |
      git clone https://github.com/25175/tvyuan.git /tmp/upstream

      rm -rf ./*
      rm -rf ./.[!.]* ./..?* 2>/dev/null || true

      cp -a /tmp/upstream/. .

  - name: 恢复工作流
    run: |
      mkdir -p .github/workflows
      cp /tmp/workflow-backup/update.yml .github/workflows/update.yml

  - name: 提交并推送
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "没有需要更新的内容"
        exit 0
      fi

      git commit -m "auto update from 25175/tvyuan"
      git push origin HEAD:master
```
