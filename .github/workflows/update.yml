name: TVBox 自动更新

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v5

      - name: 运行更新脚本
        env:
          CF_PROXY: https://tv.cc0cd.cc.cd
        run: |
          python3 update.py

      - name: 推送到 GitHub
        run: |
          git config user.email "bot@tvbox.local"
          git config user.name "TVBox Bot"

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub：无变更"
            exit 0
          fi

          git commit -m "auto update: $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:master

      - name: 推送到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          rm -f tvbox_full.json
          git add -A

          if git diff --cached --quiet; then
            echo "Gitee：无变更"
            exit 0
          fi

          git config user.email "bot@tvbox.local"
          git config user.name "TVBox Bot"
          git commit -m "gitee: auto update"

          git remote remove gitee 2>/dev/null || true
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/onm-hundred-and-eleven/tvyuan.git

          git push gitee HEAD:main --force || echo "Gitee 推送跳过"
